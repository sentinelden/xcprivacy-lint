# symbols.yaml: symbol → required-reason API category mapping.
#
# Update this file when Apple announces a new required-reason category or new
# symbols within an existing one. Source of truth for both the symbol lists and
# every reason code below:
#
#   https://developer.apple.com/documentation/bundleresources/app-privacy-configuration/nsprivacyaccessedapitypes/nsprivacyaccessedapitype
#
# Reason codes are not decoration. `valid_reasons` is what the linter offers in
# missing-declaration findings AND what it validates declared reasons against,
# so a wrong code here means the tool accepts a manifest App Store Connect will
# reject. Copy codes from Apple's page verbatim; do not paraphrase from memory.
#
# Schema (loaded by CategoryResolver):
#
#   - category: NSPrivacyAccessedAPICategoryX
#     valid_reasons: [reason-code-1, reason-code-2, ...]
#     symbols:                          # exact-match C/Swift symbol names
#       - sym_a
#       - sym_b
#     objc_methods:                     # class + selector pairs
#       - class: NSClassName
#         methods:
#           - "selectorName:withSomething:"
#     notes: |
#       Free-form contributor notes. Surface in --verbose output and in the
#       "suggested reasons" copy of missing-declaration findings.
#
# IMPORTANT: ObjC selector strings containing colons MUST be quoted in YAML.
# An unquoted `attributesOfItemAtPath:error:` is parsed as a mapping start,
# not a scalar, by every spec-compliant YAML parser. The double-quote form
# below is the safest: it preserves the colons literally and survives the
# YAMLDecoder round-trip into `methods: [String]`.
#
# KNOWN LIMITATION: `symbolIndex` maps one symbol to exactly one category, but
# Apple lists getattrlist, fgetattrlist and getattrlistat under BOTH
# FileTimestamp and DiskSpace. Each is therefore assigned to a single category
# here and may be attributed to the wrong one. Fixing this needs a
# symbol -> [category] index, not a data change.
#
# Ships with the five categories Apple currently publishes. Coverage is
# intentionally narrow. PRs adding symbols welcome, with each new symbol citing
# the Apple-docs URL that supports the mapping.

- category: NSPrivacyAccessedAPICategoryFileTimestamp
  valid_reasons: [DDA9.1, C617.1, 3B52.1, 0A2A.1]
  symbols:
    - getattrlist
    - getattrlistbulk
    - fgetattrlist
    - stat
    - lstat
    - fstat
    - fstatat
  objc_methods:
    - class: NSFileManager
      methods:
        - "attributesOfItemAtPath:error:"
        - "modificationDate"
    - class: NSURL
      methods:
        - "getResourceValue:forKey:error:"
        - "resourceValuesForKeys:error:"
  notes: |
    Triggered by file-timestamp reads via FileManager APIs, the
    contentModificationDateKey / creationDateKey URL resource keys, or the
    lower-level POSIX stat and getattrlist families. Reason codes:
      DDA9.1, Display file timestamps to the person using the device.
               Information accessed for this reason may not be sent off-device.
      C617.1, Access timestamps, size or other metadata of files inside the
               app container, app group container, or the app's CloudKit
               container. The most common case for in-app persistence.
      3B52.1, Access timestamps, size or other metadata of files or
               directories the user specifically granted access to, such as
               through a document picker.
      0A2A.1, THIRD-PARTY SDKs ONLY. Declare only if your SDK wraps a file
               timestamp API for the host app to call. An app target must not
               declare this code.

- category: NSPrivacyAccessedAPICategorySystemBootTime
  valid_reasons: [35F9.1, 8FFB.1, 3D61.1]
  symbols:
    - mach_absolute_time
    - mach_continuous_time
  objc_methods:
    - class: NSProcessInfo
      methods:
        - "systemUptime"
  notes: |
    Triggered by reading system boot time / uptime, typically via
    `ProcessInfo.systemUptime` (Swift) or `mach_absolute_time()` (C).
    Note that `mach_continuous_time` is not named on Apple's list; it is
    included here because it derives from the same clock, so it may produce a
    finding Apple would not require. Reason codes:
      35F9.1, Measure time elapsed between events within the app, or perform
               calculations to enable timers. Elapsed-time information may be
               sent off-device; the boot time itself may not.
      8FFB.1, Calculate absolute timestamps for events within your app, such
               as UIKit or AVFAudio events. Those timestamps may be sent
               off-device; boot time and anything else derived from it may not.
      3D61.1, Include boot time in an optional bug report the user chooses to
               submit, with the information prominently displayed as part of
               the report.

- category: NSPrivacyAccessedAPICategoryDiskSpace
  valid_reasons: [85F4.1, E174.1, 7D9E.1, B728.1]
  symbols:
    - statfs
    - statvfs
    - fstatfs
    - fstatvfs
    - getattrlistat
  objc_methods:
    - class: NSURL
      methods:
        - "resourceValuesForKeys:error:"
        - "getResourceValue:forKey:error:"
    - class: NSFileManager
      methods:
        - "attributesOfFileSystemForPath:error:"
  notes: |
    Triggered by checking available or total disk space, typically via the
    volumeAvailableCapacityKey, volumeAvailableCapacityForImportantUsageKey,
    volumeAvailableCapacityForOpportunisticUsageKey or volumeTotalCapacityKey
    URL resource keys, or the statfs family. Reason codes:
      85F4.1, Display disk space information to the person using the device.
               May not be sent off-device, with a narrow local-network
               exception for displaying it on the same person's other device.
      E174.1, Check whether there is enough space to write files, or whether
               space is low so the app can delete files. The app must behave
               differently based on disk space in a way users can observe.
      7D9E.1, Include disk space in an optional bug report the user chooses to
               submit, with the information prominently displayed as part of
               the report.
      B728.1, HEALTH RESEARCH APPS ONLY. Declare only to inform research
               participants that low disk space is affecting data collection,
               subject to App Store Review Guideline 5.1.3.

- category: NSPrivacyAccessedAPICategoryActiveKeyboards
  valid_reasons: [3EC4.1, 54BD.1]
  symbols: []
  objc_methods:
    - class: UITextInputMode
      methods:
        - "activeInputModes"
  notes: |
    Triggered by reading the list of active keyboards. Reason codes:
      3EC4.1, CUSTOM KEYBOARD APPS ONLY. Providing a systemwide custom
               keyboard must be the app's primary functionality.
      54BD.1, Present the correct customized interface to the person using the
               device. The app must have text fields for entering or editing
               text and must behave differently based on active keyboards in a
               way users can observe.

- category: NSPrivacyAccessedAPICategoryUserDefaults
  valid_reasons: [CA92.1, 1C8F.1, C56D.1, AC6B.1]
  symbols: []
  objc_methods:
    - class: NSUserDefaults
      methods:
        - "standardUserDefaults"
        - "initWithSuiteName:"
        - "objectForKey:"
        - "stringForKey:"
        - "integerForKey:"
        - "boolForKey:"
        - "setObject:forKey:"
        - "setBool:forKey:"
        - "setInteger:forKey:"
  notes: |
    Triggered by reading or writing `UserDefaults` / `NSUserDefaults`.
    Reason codes:
      CA92.1, Read and write information accessible only to the app itself.
               The usual choice for an app storing its own preferences.
      1C8F.1, Read and write information accessible only to the apps, app
               extensions and App Clips in the same App Group.
      C56D.1, THIRD-PARTY SDKs ONLY. Declare only if your SDK wraps a user
               defaults API for the host app to call. An app target must not
               declare this code.
      AC6B.1, Read the com.apple.configuration.managed key for MDM app
               configuration, or write com.apple.feedback.managed for MDM
               feedback.
